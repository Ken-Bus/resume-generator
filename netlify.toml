[build]
  publish = "."
  functions = "netlify/functions"

[functions."check-code-supply"]
  schedule = "@daily"

# Removes expired recovery copies (migration 04). Expired copies are already unreadable; this only tidies the table.
[functions."purge-recovery"]
  schedule = "@hourly"

# ── What is public ─────────────────────────────────────────────────────────────────────────────────────────────────
# `publish = "."` serves the whole repository root, so anything not blocked below is downloadable. The customer page needs exactly:
#   index.html, wizard.js, resume-core.js, templates.js, 404.html     (and the functions under /.netlify/functions/*)
# Everything else (function source and prompts, SQL, scripts, tests, docs, setup notes, package files) is answered with a 404 even though
# the file exists. tests/functions/publication.test.js fails if a tracked file is neither on that list nor covered by a rule here.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # The page uses inline scripts, handlers and styles and Google Fonts; nothing else is loaded, and it talks only to its own origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
